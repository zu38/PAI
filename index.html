<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAI Chatbot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
        }

        .chat-container {
            width: 90vw;
            max-width: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transform: scale(0.9);
            animation: scaleUp 0.3s ease forwards;
        }

        @keyframes scaleUp {
            to { transform: scale(1); }
        }

        .chat-header {
            padding: 1.5rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            width: 25px;
            height: 25px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .header-btn:hover {
            transform: scale(1.1);
        }

        .minimize-btn { background: #f59e0b; }
        .close-btn { background: #ef4444; }

        .chat-body {
            height: 400px;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            animation: messageSlide 0.3s ease;
            transform-origin: bottom;
        }

        @keyframes messageSlide {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .user-message {
            background: #6366f1;
            color: white;
            align-self: flex-end;
            border-radius: 20px 20px 0 20px;
        }

        .bot-message {
            background: #f3f4f6;
            color: #1f2937;
            align-self: flex-start;
            border-radius: 20px 20px 20px 0;
        }

        .input-container {
            padding: 1.5rem;
            display: flex;
            gap: 10px;
            border-top: 2px solid #f3f4f6;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s;
        }

        #user-input:focus {
            border-color: #6366f1;
        }

        #send-btn {
            padding: 12px 24px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        #send-btn:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .loading-dots {
            display: inline-block;
            position: relative;
            width: 80px;
            height: 20px;
        }

        .loading-dots div {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6366f1;
            animation-timing-function: cubic-bezier(0, 1, 1, 0);
        }

        .loading-dots div:nth-child(1) {
            left: 8px;
            animation: loading-dots1 0.6s infinite;
        }

        .loading-dots div:nth-child(2) {
            left: 8px;
            animation: loading-dots2 0.6s infinite;
        }

        .loading-dots div:nth-child(3) {
            left: 32px;
            animation: loading-dots2 0.6s infinite;
        }

        .loading-dots div:nth-child(4) {
            left: 56px;
            animation: loading-dots3 0.6s infinite;
        }

        @keyframes loading-dots1 {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes loading-dots3 {
            0% { transform: scale(1); }
            100% { transform: scale(0); }
        }

        @keyframes loading-dots2 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(24px, 0); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h3>P-AI Assistant</h3>
            <div class="header-buttons">
                <button class="header-btn minimize-btn"></button>
                <button class="header-btn close-btn"></button>
            </div>
        </div>
        <div class="chat-body" id="chat-body">
            <div class="message bot-message">
                Hello! I'm your Prabhas-AI assistant. Ask me anything!
            </div>
        </div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatBody = document.getElementById('chat-body');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const minimizeBtn = document.querySelector('.minimize-btn');
        const closeBtn = document.querySelector('.close-btn');
        let isMinimized = false;
        const API_KEY = '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';

        function showLoading() {
            const loading = document.createElement('div');
            loading.className = 'message bot-message';
            loading.innerHTML = `
                <div class="loading-dots">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            `;
            chatBody.appendChild(loading);
            chatBody.scrollTop = chatBody.scrollHeight;
            return loading;
        }

        async function getAIResponse(userMessage) {
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "HTTP-Referer": "https:zu38.github.io",
                        "X-Title": "PAI Chatbot",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "deepseek/deepseek-r1:free",
                        "messages": [{
                            "role": "user",
                            "content": userMessage
                        }]
                    })
                });

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error('Error:', error);
                return "Sorry, I'm having trouble connecting to the AI service.";
            }
        }

        async function handleUserInput() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';

            const loading = showLoading();
            
            try {
                const response = await getAIResponse(message);
                loading.remove();
                addMessage(response);
            } catch (error) {
                loading.remove();
                addMessage("Sorry, something went wrong. Please try again.");
            }
        }

        function addMessage(message, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', isUser ? 'user-message' : 'bot-message');
            messageDiv.textContent = message;
            chatBody.appendChild(messageDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // Event Listeners
        sendBtn.addEventListener('click', handleUserInput);
        userInput.addEventListener('keypress', (e) => e.key === 'Enter' && handleUserInput());

        minimizeBtn.addEventListener('click', () => {
            isMinimized = !isMinimized;
            chatBody.classList.toggle('hidden', isMinimized);
            document.querySelector('.input-container').classList.toggle('hidden', isMinimized);
        });

        closeBtn.addEventListener('click', () => {
            document.querySelector('.chat-container').style.display = 'none';
        });
    </script>
</body>
</html>

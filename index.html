<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #007bff;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.2rem;
    }
    .chat-window {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      background: #eef1f5;
    }
    .message {
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 20px;
      margin: 5px 0;
      line-height: 1.4;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #007bff;
      color: white;
    }
    .bot {
      align-self: flex-start;
      background: #e4e6eb;
      color: black;
    }
    .chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
    }
    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      margin-right: 10px;
    }
    .chat-input button {
      padding: 10px 20px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 20px;
      cursor: pointer;
    }
    .chat-input button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>OpenRouter GPT-4o Chat</header>
    <div id="chat-window" class="chat-window"></div>
    <div class="chat-input">
      <input id="user-input" type="text" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatWindow = document.getElementById("chat-window");
    const userInput = document.getElementById("user-input");

    function appendMessage(content, className) {
      const msg = document.createElement("div");
      msg.className = `message ${className}`;
      msg.textContent = content;
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage(message, "user");
      userInput.value = "";
      appendMessage("Bot is typing...", "bot typing");

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json",
            "HTTP-Referer": "https://your-github-page-url",  // optional
            "X-Title": "GitHub Chatbot"
          },
          body: JSON.stringify({
            model: "openai/gpt-4o",
            messages: [{ role: "user", content: message }]
          })
        });

        const data = await response.json();
        console.log("API response:", data);
        document.querySelector(".typing")?.remove();

        const reply = data?.choices?.[0]?.message?.content;
        if (reply) {
          appendMessage(reply, "bot");
        } else {
          appendMessage("❌ Error: No reply received.", "bot");
        }

      } catch (error) {
        document.querySelector(".typing")?.remove();
        console.error("Fetch error:", error);
        appendMessage("❌ Error: Failed to connect to API.", "bot");
      }
    }
  </script>
</body>
</html>

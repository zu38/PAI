<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Chatbot</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7.22.10/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gradient-to-r from-blue-100 to-purple-100">
  <div id="root"></div>
  <script type="text/javascript">
    var gk_isXlsx = true;
    var gk_xlsxFileLookup = {};
    var gk_fileData = {};
    function filledCell(cell) {
      return cell !== '' && cell != null;
    }
    function loadFileData(filename) {
      if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
        try {
          var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
          var firstSheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[firstSheetName];

          // Convert sheet to JSON to filter blank rows
          var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
          // Filter out blank rows (rows where all cells are empty, null, or undefined)
          var filteredData = jsonData.filter(row => row.some(filledCell));

          // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
          var headerRowIndex = filteredData.findIndex((row, index) =>
            row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
          );
          // Fallback
          if (headerRowIndex === -1 || headerRowIndex > 25) {
            headerRowIndex = 0;
          }

          // Convert filtered JSON back to CSV
          var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
          csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
          return csv;
        } catch (e) {
          console.error(e);
          return "";
        }
      }
      return gk_fileData[filename] || "";
    }
  </script>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const Message = ({ role, content }) => (
      <div class={`p-3 rounded-lg mb-2 max-w-xs ${role === 'user' ? 'bg-blue-500 text-white ml-auto' : 'bg-gray-200 text-gray-800 mr-auto'}`}>
        <p class="whitespace-pre-wrap">{content}</p>
      </div>
    );

    const App = () => {
      const [input, setInput] = useState('');
      const [messages, setMessages] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const messagesEndRef = useRef(null);
      const fileInputRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      const handleSend = async () => {
        if (!input.trim()) return;

        const userMessage = { role: 'user', content: input };
        setMessages([...messages, userMessage]);
        setInput('');
        setIsLoading(true);

        try {
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer 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',
              'HTTP-Referer': 'https://zu38.github.io/PAI',
              'X-Title': 'PAI Chatbot',
            },
            body: JSON.stringify({
              model: 'deepseek/deepseek-r1:free',
              messages: [...messages, userMessage].map(msg => ({
                role: msg.role,
                content: msg.content,
              })),
            }),
          });
          const data = await res.json();
          const botMessage = { role: 'assistant', content: data.choices[0].message.content };
          setMessages(prev => [...prev, botMessage]);
        } catch (error) {
          setMessages(prev => [...prev, { role: 'assistant', content: 'Error: Unable to get response from the server.' }]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        setIsLoading(true);
        const filename = file.name;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const base64Data = e.target.result.split(',')[1]; // Remove data URL prefix
            gk_xlsxFileLookup[filename] = true;
            gk_fileData[filename] = base64Data;

            const csvData = loadFileData(filename);
            if (csvData) {
              setMessages(prev => [...prev, { role: 'assistant', content: `Processed ${filename}:\n${csvData}` }]);
            } else {
              setMessages(prev => [...prev, { role: 'assistant', content: `Error processing ${filename}.` }]);
            }
          } catch (error) {
            setMessages(prev => [...prev, { role: 'assistant', content: `Error processing ${filename}: ${error.message}` }]);
          } finally {
            setIsLoading(false);
            fileInputRef.current.value = ''; // Reset file input
          }
        };
        reader.readAsDataURL(file);
      };

      const clearChat = () => {
        setMessages([]);
        gk_xlsxFileLookup = {};
        gk_fileData = {};
      };

      return (
        <div class="flex flex-col items-center justify-center min-h-screen p-4">
          <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-lg">
            <div class="flex justify-between items-center mb-4">
              <h1 class="text-3xl font-bold text-gray-800">Advanced Chatbot</h1>
              <button
                onClick={clearChat}
                class="text-sm bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600"
              >
                Clear Chat
              </button>
            </div>
            <div class="h-96 overflow-y-auto mb-4 p-4 bg-gray-50 rounded-lg">
              {messages.length === 0 ? (
                <p class="text-gray-500 italic text-center">Start the conversation or upload an XLSX file!</p>
              ) : (
                messages.map((msg, index) => (
                  <Message key={index} role={msg.role} content={msg.content} />
                ))
              )}
              {isLoading && (
                <div class="flex justify-center">
                  <div class="animate-spin h-5 w-5 border-4 border-blue-500 border-t-transparent rounded-full"></div>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>
            <div class="flex mb-2">
              <input
                type="file"
                accept=".xlsx"
                onChange={handleFileUpload}
                ref={fileInputRef}
                class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                disabled={isLoading}
              />
            </div>
            <div class="flex">
              <input
                type="text"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                class="flex-1 p-3 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Type your message..."
                disabled={isLoading}
              />
              <button
                onClick={handleSend}
                class="bg-blue-500 text-white p-3 rounded-r-lg hover:bg-blue-600 disabled:bg-blue-300"
                disabled={isLoading}
              >
                Send
              </button>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>

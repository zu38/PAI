<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 400px;
    }
    .chat-box {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding: 10px;
      background-color: #f1f1f1;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .input-container {
      display: flex;
    }
    .input-container input {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .input-container button {
      padding: 10px;
      border: 1px solid #ccc;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 10px;
    }
    .input-container button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-box" id="chat-box"></div>
    <div class="input-container">
      <input type="text" id="user-input" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const apiKey = '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';
    const siteUrl = 'https://zu38.github.io/PAI';
    const siteName = 'PAI chatbot';
    
    async function sendMessage() {
      const userInput = document.getElementById('user-input').value;
      if (!userInput) return;

      // Display user's message
      appendMessage('You: ' + userInput);

      // Call the API
      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            Authorization: `Bearer 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`,
            'HTTP-Referer': https://zu38.github.io/PAI,
            'X-Title': PAI chatbot,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            model: 'openai/gpt-4o',
            messages: [
              { role: 'user', content: userInput },
            ],
          }),
        });

        const data = await response.json();
        const botResponse = data.choices[0]?.message?.content || "Sorry, I couldn't get a response.";
        
        // Display bot's response
        appendMessage('Bot: ' + botResponse);
      } catch (error) {
        console.error('Error:', error);
        appendMessage('Bot: Error occurred. Please try again.');
      }

      // Clear input field
      document.getElementById('user-input').value = '';
    }

    function appendMessage(message) {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<div>${message}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
